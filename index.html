<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ma télécommande PitPat</title>
    <!-- MDL CSS & JS -->
    <link rel="icon" href="icon-192.png">
    <!-- PWA : installation sur le téléphone -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#6a1b9a">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/material-design-lite@1.3.0/material.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <script defer src="https://cdn.jsdelivr.net/npm/material-design-lite@1.3.0/material.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <style>
        /* Interface télécommande, pensée pour mobile (360 x 640 et plus) */
        html, body {
            height: 100%;
            margin: 0;
        }
        body {
            font-family: Roboto, Arial, sans-serif;
            background: #f2f4f7;
            color: #222;
        }
        .mdl-layout__header, #history-panel { display: none !important; }
        .mdl-layout__content { overflow-x: hidden; }

        .center-container {
            box-sizing: border-box;
            min-height: 100vh;
            min-height: 100dvh;
            max-width: 480px;
            margin: 0 auto;
            padding: 24px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* En-tête fixé en haut : titre, connexion et état du tapis */
        .app-header { display: flex; flex-direction: column; gap: 10px; }
        .app-title {
            text-align: center;
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: .06em;
        }
        .app-header-row { display: flex; gap: 10px; align-items: stretch; }
        #connectBtn {
            flex: 1;
            min-width: 0;
            height: auto;
            min-height: 52px;
            margin: 0;
            padding: 8px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            line-height: 1.2;
            white-space: normal;
            background: #2196f3 !important;
            color: #fff !important;
            touch-action: manipulation;
        }
        #statusChip {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            height: auto;
            margin: 0;
            padding: 0 14px;
            border-radius: 12px;
            font-weight: 700;
        }
        #statusChip .mdl-chip__text { font-size: .95rem; white-space: nowrap; }

        /* Reste de la page, centré dans l'espace sous l'en-tête */
        .app-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 14px;
        }

        /* Boutons : grille de 2 colonnes */
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .controls .mdl-button {
            height: auto;
            min-height: 64px;
            min-width: 0;
            margin: 0;
            padding: 8px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 800;
            line-height: 1.2;
            white-space: normal;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        #startBtn { background: #2e7d32 !important; color: #fff !important; }
        #stopBtn { background: #b71c1c !important; color: #fff !important; }
        .btn-red:disabled, .btn-green:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            box-shadow: none !important;
        }

        /* Seule la carte Vitesse est affichée */
        .dashboard .mdl-card { display: none; }
        .dashboard .mdl-card:first-child {
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            width: 100%;
            min-height: 0;
            padding: 12px;
            border-radius: 16px;
            text-align: center;
        }
        .dashboard .mdl-card__title { padding: 0; justify-content: center; }
        .dashboard .card-title { font-size: 1rem; color: #777; }
        .dashboard .card-value {
            width: auto;
            padding: 4px 0 0;
            font-size: 3rem;
            line-height: 1.1;
            font-weight: 700;
            color: #222;
            white-space: nowrap;
        }

        /* Curseur de vitesse */
        .slider-group {
            box-sizing: border-box;
            padding: 14px 8px;
            border-radius: 14px;
            background: #fff;
            box-shadow: 0 2px 8px #00000012;
        }
        .slider-label {
            display: block;
            margin: 0 8px 10px;
            font-size: 1rem;
            font-weight: 700;
        }
        .mdl-slider { width: 100%; }

        /* Programmes de marche (programs.js) */
        .program-group {
            box-sizing: border-box;
            padding: 10px;
            border-radius: 14px;
            background: #fff;
            box-shadow: 0 2px 8px #00000012;
        }
        /* Hors programme : seul le bouton est visible */
        body:not(.program-running) .program-group {
            padding: 0;
            background: none;
            box-shadow: none;
        }
        #programBtn {
            width: 100%;
            height: auto;
            min-height: 52px;
            margin: 0;
            padding: 8px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 800;
            line-height: 1.2;
            background: #6a1b9a !important;
            color: #fff !important;
            touch-action: manipulation;
        }
        .program-progress { display: none; margin-top: 8px; }
        .program-info {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 2px;
            font-size: .95rem;
            font-weight: 700;
        }
        .program-profile { display: block; width: 100%; height: 44px; }
        .profile-area { fill: #6a1b9a22; }
        .profile-line { fill: none; stroke: #6a1b9a; stroke-width: 2; vector-effect: non-scaling-stroke; }
        #programCursor { stroke: #e53935; stroke-width: 2; vector-effect: non-scaling-stroke; }
        /* Pendant un programme : on remplace le curseur de vitesse par la progression */
        body.program-running .slider-group { display: none; }
        body.program-running .program-progress { display: block; }

        /* Fenêtre de choix du programme */
        .program-modal {
            box-sizing: border-box;
            width: calc(100% - 24px);
            max-width: 440px;
            max-height: calc(100vh - 24px);
            max-height: calc(100dvh - 24px);
            padding: 0;
            border: none;
            border-radius: 16px;
            color: #222;
            box-shadow: 0 8px 32px #00000040;
            overflow: hidden;
        }
        .program-modal::backdrop { background: rgba(0, 0, 0, .5); }
        /* Seule la liste des programmes défile ; en-tête, courbe et boutons restent visibles */
        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: calc(100vh - 24px);
            max-height: calc(100dvh - 24px);
            box-sizing: border-box;
            padding: 14px;
        }
        .modal-header, .modal-preview, .modal-hint, .modal-actions { flex-shrink: 0; }
        .modal-header { display: flex; align-items: center; justify-content: space-between; }
        .modal-header h2 { margin: 0; font-size: 1.2rem; font-weight: 800; line-height: 1.3; }
        .modal-close {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: #f0f0f0;
            color: #444;
            font-size: 1.1rem;
            cursor: pointer;
        }
        .program-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
            padding: 2px;
            margin: -2px;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
        }
        .program-item { flex-shrink: 0; }
        .program-item-head {
            display: flex;
            width: 100%;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .program-item-level { color: #6a1b9a; font-size: .8rem; letter-spacing: 2px; white-space: nowrap; }
        .program-item {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #ddd;
            border-radius: 12px;
            background: #fff;
            color: #222;
            font: inherit;
            text-align: left;
            cursor: pointer;
            touch-action: manipulation;
        }
        .program-item[aria-checked="true"] { border-color: #6a1b9a; background: #6a1b9a14; }
        .program-item-name { font-size: 1rem; font-weight: 800; }
        .program-item[aria-checked="true"] .program-item-name { color: #6a1b9a; }
        .program-item-meta { font-size: .85rem; font-weight: 700; color: #555; }
        .program-item-desc { font-size: .85rem; color: #777; }
        .modal-preview { padding: 8px 10px; border-radius: 12px; background: #f6f2f8; }
        .modal-hint { margin: 0; font-size: .9rem; color: #b71c1c; text-align: center; }
        .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .modal-btn {
            min-height: 48px;
            border: none;
            border-radius: 12px;
            background: #e8e8e8;
            color: #222;
            font: inherit;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            touch-action: manipulation;
        }
        .modal-btn--primary { background: #6a1b9a; color: #fff; }
        .modal-btn:disabled { opacity: .45; cursor: not-allowed; }

        /* Couleurs de l'état du tapis (utilisées par treadmill.js) */
        .chip-connected { background: #388e3c !important; color: #fff !important; }
        .chip-connecting, .chip-paused { background: #fbc02d !important; color: #222 !important; }
        .chip-disconnected { background: #d32f2f !important; color: #fff !important; }

        /* Écrans peu hauts (barre du navigateur affichée, mode paysage...) */
        @media (max-height: 700px) {
            .center-container { gap: 8px; padding-top: 20px; padding-bottom: 10px; }
            .controls .mdl-button { min-height: 48px; }
            #connectBtn { min-height: 44px; }
            .app-header, .app-main { gap: 8px; }
            .dashboard .mdl-card:first-child { padding: 8px; }
            .dashboard .card-value { font-size: 2.2rem; }
            .slider-group { padding: 8px; }
            .slider-label { margin-bottom: 6px; }
            body.program-running .program-group { padding: 8px; }
            #programBtn { min-height: 48px; }
        }
    </style>
</head>
<body>
    <div id="appVersion" style="position:fixed;top:6px;left:8px;font-size:11px;color:#999;z-index:10001;pointer-events:none;">v1.3</div>
    <div class="mdl-layout mdl-js-layout mdl-layout--fixed-tabs">
        <header class="mdl-layout__header mdl-layout__header--scroll" style="justify-content:center;display:flex;">
            <div class="mdl-layout__tab-bar mdl-js-ripple-effect">
                <a href="#controls-panel" class="mdl-layout__tab is-active">Télécommande</a>
            </div>
        </header>
        <main class="mdl-layout__content">
            <section class="mdl-layout__tab-panel is-active" id="controls-panel">
                <div class="center-container">
                    <div class="app-header">
                        <div class="app-title">TÉLÉCOMMANDE PITPAT</div>
                        <div class="app-header-row">
                            <button id="connectBtn" class="mdl-button mdl-js-button mdl-button--raised mdl-js-ripple-effect mdl-button--primary">Connexion Bluetooth</button>
                            <span id="statusChip" class="mdl-chip chip-disconnected" role="status"><span class="mdl-chip__text">Déconnecté</span></span>
                        </div>
                    </div>
                    <div class="app-main">
                    <div class="dashboard">
                        <div class="mdl-card mdl-shadow--2dp">
                            <div class="mdl-card__title"><span class="card-title">Vitesse</span></div>
                            <div class="mdl-card__supporting-text card-value" id="speed">-</div>
                        </div>
                        <div class="mdl-card mdl-shadow--2dp">
                            <div class="mdl-card__title"><span class="card-title">Distance</span></div>
                            <div class="mdl-card__supporting-text card-value" id="distance">-</div>
                        </div>
                        <div class="mdl-card mdl-shadow--2dp">
                            <div class="mdl-card__title"><span class="card-title">Calories</span></div>
                            <div class="mdl-card__supporting-text card-value" id="calories">-</div>
                        </div>
                        <div class="mdl-card mdl-shadow--2dp">
                            <div class="mdl-card__title"><span class="card-title">Pas</span></div>
                            <div class="mdl-card__supporting-text card-value" id="steps">-</div>
                        </div>
                        <div class="mdl-card mdl-shadow--2dp">
                            <div class="mdl-card__title"><span class="card-title">Durée</span></div>
                            <div class="mdl-card__supporting-text card-value" id="duration">-</div>
                        </div>
                    </div>
                    <div class="controls">
                        <button id="startBtn" class="mdl-button mdl-js-button mdl-button--raised mdl-js-ripple-effect btn-green" disabled>DÉMARRER</button>
                        <button id="stopBtn" class="mdl-button mdl-js-button mdl-button--raised mdl-js-ripple-effect btn-red" disabled>ARRÊTER</button>
                        <button id="speedDownBtn" class="mdl-button mdl-js-button mdl-button--raised mdl-js-ripple-effect" disabled>− RALENTIR</button>
                        <button id="speedUpBtn" class="mdl-button mdl-js-button mdl-button--raised mdl-js-ripple-effect" disabled>+ ACCÉLÉRER</button>
                    </div>
                    <div class="slider-group">
                        <label class="slider-label" for="speedSlider">Régler la vitesse (km/h) : <span id="sliderValue">0</span></label>
                        <input type="range" id="speedSlider" min="1" max="6" step="0.1" value="1" class="mdl-slider mdl-js-slider">
                    </div>
                    <div class="program-group">
                        <button id="programBtn" class="mdl-button mdl-js-button mdl-button--raised mdl-js-ripple-effect">▶ PROGRAMMES</button>
                        <div class="program-progress">
                            <div class="program-info"><span id="programTarget"></span><span id="programTime"></span></div>
                            <svg id="programProfile" class="program-profile" viewBox="0 0 300 50" preserveAspectRatio="none" aria-hidden="true">
                                <path class="profile-area"></path>
                                <path class="profile-line"></path>
                                <line id="programCursor" x1="0" x2="0" y1="0" y2="50"></line>
                            </svg>
                        </div>
                    </div>
                    </div>
                </div>
            </section>
            <section class="mdl-layout__tab-panel" id="history-panel">
                <div class="center-container">
                    <div style="display:flex;justify-content:center;gap:0.5em;margin-bottom:0.5em;width:100%;max-width:700px;">
                        <button id="exportHistoryBtn" class="mdl-button mdl-js-button mdl-button--raised mdl-js-ripple-effect">Export</button>
                        <button id="importHistoryBtn" class="mdl-button mdl-js-button mdl-button--raised mdl-js-ripple-effect">Import</button>
                        <input type="file" id="importHistoryInput" accept="application/json" style="display:none;" />
                    </div>
                    <div class="history-table-container">
                        <table class="mdl-data-table mdl-js-data-table mdl-shadow--2dp" >
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Duration</th>
                                    <th>Steps</th>
                                    <th>Calories</th>
                                    <th>Avg Speed</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="historyTableBody">
                                <!-- Sessions will be injected here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <!-- Program selection modal (programs.js) -->
    <dialog id="programModal" class="program-modal" aria-labelledby="programModalTitle">
        <div class="modal-body">
            <div class="modal-header">
                <h2 id="programModalTitle">Programmes</h2>
                <button type="button" id="programModalClose" class="modal-close" aria-label="Fermer">✕</button>
            </div>
            <div id="programList" class="program-list" role="radiogroup" aria-label="Programme de marche"></div>
            <div class="modal-preview">
                <div class="program-info"><span id="previewMax"></span><span id="previewDuration"></span></div>
                <svg id="previewProfile" class="program-profile" viewBox="0 0 300 50" preserveAspectRatio="none" aria-hidden="true">
                    <path class="profile-area"></path>
                    <path class="profile-line"></path>
                </svg>
            </div>
            <p id="programModalHint" class="modal-hint" hidden>Connectez d'abord le tapis pour lancer un programme.</p>
            <div class="modal-actions">
                <button type="button" id="programCancelBtn" class="modal-btn">Annuler</button>
                <button type="button" id="programLaunchBtn" class="modal-btn modal-btn--primary">▶ Lancer</button>
            </div>
        </div>
    </dialog>
    <!-- Loading Overlay -->
    <div id="loadingOverlay" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(255,255,255,0.7);z-index:9999;align-items:center;justify-content:center;">
        <div class="mdl-spinner mdl-js-spinner is-active" style="width:64px;height:64px;"></div>
    </div>
    <!-- Countdown Overlay -->
    <div id="countdownOverlay" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(33,33,33,0.85);z-index:10000;align-items:center;justify-content:center;opacity:1;transition:opacity 0.5s;">
        <span id="countdownNumber" style="color:#fff;font-size:6em;font-weight:bold;transition:transform 0.3s, opacity 0.3s;">3</span>
    </div>
    <!-- Snackbar for toast messages -->
    <div id="snackbar" class="mdl-js-snackbar mdl-snackbar">
        <div class="mdl-snackbar__text"></div>
        <button class="mdl-snackbar__action" type="button"></button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/date-fns@4.1.0/cdn.min.js"></script>
    <script src="treadmill.js"></script>
    <script src="programs.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch((err) => console.warn('Service worker non enregistré :', err));
        }
        // Ask Android not to clear the offline copy when storage runs low
        if (navigator.storage && navigator.storage.persist) {
            navigator.storage.persist().catch(() => {});
        }
    </script>
</body>
</html>
